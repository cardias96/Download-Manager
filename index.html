<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de APKs e Open-Source</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta name="theme-color" content="#1e293b">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 sm:p-6">

    <div class="max-w-2xl mx-auto space-y-6">
        <header class="text-center space-y-2">
            <h1 class="text-2xl font-bold text-blue-400">Meus Apps & Atualizações</h1>
            <p class="text-sm text-slate-400">Clica em "Não instalado / Instalado" para memorizar o teu inventário e descarrega os APKs diretamente.</p>
        </header>

        <div class="flex justify-between items-center bg-slate-900 p-4 rounded-xl border border-slate-800">
            <div>
                <p class="text-sm font-medium text-slate-200">Painel de Controlo</p>
                <p class="text-xs text-slate-400" id="statusCount">Pronto a usar</p>
            </div>
            <button onclick="renderList()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-xs font-medium transition flex items-center gap-1.5">
                🔄 Atualizar Vista
            </button>
        </div>

        <div id="appList" class="space-y-3">
            <!-- Injetado dinamicamente -->
        </div>
    </div>

    <script>
        // Lista com os repositórios e os nomes exatos/padrão dos ficheiros para download direto infalível
        const predefinedApps = [
            { name: "Tailscale", target: "tailscale/tailscale-android", file: "tailscale-release.apk", pkg: "com.tailscale.ipn", type: "github" },
            { name: "PipePipe", target: "InfinityLoop1308/PipePipe", file: "app-universal-release.apk", pkg: "org.infinity.pipepipe", type: "github" },
            { name: "Ungoogled Chromium", target: "ungoogled-software/ungoogled-chromium-android", file: "ungoogled-chromium_arm64.apk", pkg: "org.chromium.ungoogled.chromium", type: "github_page" },
            { name: "KeePassDX", target: "Kunzisoft/KeePassDX", file: "KeePassDX-libre.apk", pkg: "com.kunzisoft.keepass.libre", type: "github_page" },
            { name: "DAVx5 OSE", target: "bitfireAT/davx5-ose", file: "davx5-ose-gplay-release.apk", pkg: "at.bitfire.davdroid", type: "github_page" },
            { name: "FolderSync", target: "https://www.apkmirror.com/apk/tacit-dynamics/foldersync/", pkg: "dk.tacit.android.foldersync.full", type: "web" },
            { name: "VLC Android", target: "https://get.videolan.org/vlc-android/", pkg: "org.videolan.vlc", type: "web" },
            // Fossify Apps (Utilizam o padrão de nomenclatura oficial da organização no GitHub)
            { name: "Fossify Phone", target: "FossifyOrg/Phone", file: "phone-release.apk", pkg: "org.fossify.phone", type: "github" },
            { name: "Fossify Documents", target: "FossifyOrg/Documents", file: "documents-release.apk", pkg: "org.fossify.documents", type: "github" },
            { name: "Fossify Notes", target: "FossifyOrg/Notes", file: "notes-release.apk", pkg: "org.fossify.notes", type: "github" },
            { name: "Fossify Math", target: "FossifyOrg/Calculator", file: "calculator-release.apk", pkg: "org.fossify.math", type: "github" },
            { name: "Fossify Keyboard", target: "FossifyOrg/Keyboard", file: "keyboard-release.apk", pkg: "org.fossify.keyboard", type: "github" },
            { name: "Fossify Camera", target: "FossifyOrg/Camera", file: "camera-release.apk", pkg: "org.fossify.camera", type: "github" },
            { name: "Fossify Calendar", target: "FossifyOrg/Calendar", file: "calendar-release.apk", pkg: "org.fossify.calendar", type: "github" },
            { name: "Fossify Clock", target: "FossifyOrg/Clock", file: "clock-release.apk", pkg: "org.fossify.clock", type: "github" },
            { name: "Fossify Home", target: "FossifyOrg/Launcher", file: "launcher-release.apk", pkg: "org.fossify.home", type: "github" },
            { name: "Fossify Voice Recorder", target: "FossifyOrg/Voice-Recorder", file: "voice-recorder-release.apk", pkg: "org.fossify.voicerecorder", type: "github" },
            { name: "Fossify File Manager", target: "FossifyOrg/File-Manager", file: "file-manager-release.apk", pkg: "org.fossify.filemanager", type: "github" },
            { name: "Fossify Gallery", target: "FossifyOrg/Gallery", file: "gallery-release.apk", pkg: "org.fossify.gallery", type: "github" },
            { name: "Fossify Messages", target: "FossifyOrg/Messages", file: "messages-release.apk", pkg: "org.fossify.messages", type: "github" },
            { name: "Fossify Music Player", target: "FossifyOrg/Music-Player", file: "music-player-release.apk", pkg: "org.fossify.musicplayer", type: "github" },
            { name: "Fossify Contacts", target: "FossifyOrg/Contacts", pkg: "org.fossify.contacts", type: "github_page" }
        ];

        let installedMap = JSON.parse(localStorage.getItem('user_installed_apps') || '{}');

        function toggleInstallState(pkg) {
            installedMap[pkg] = !installedMap[pkg];
            localStorage.setItem('user_installed_apps', JSON.stringify(installedMap));
            renderList();
        }

        function renderList() {
            const container = document.getElementById('appList');
            
            container.innerHTML = predefinedApps.map((app) => {
                const isInstalled = installedMap[app.pkg] || false;
                
                const badgeClass = isInstalled 
                    ? "bg-emerald-950 text-emerald-400 border border-emerald-800/50" 
                    : "bg-slate-800 text-slate-400 hover:bg-slate-700";
                
                const badgeText = isInstalled ? "Instalado ✓ (Mudar)" : "Não instalado (Mudar)";

                let downloadLink = "";
                let buttonText = "Descarregar APK";
                let buttonClass = "bg-blue-600 hover:bg-blue-500 text-white";

                if (app.type === 'github') {
                    // O link mágico do GitHub que redireciona sempre para o ficheiro mais recente da release
                    downloadLink = `https://github.com/${app.target}/releases/latest/download/${app.file}`;
                } else if (app.type === 'github_page') {
                    // Caso o nome exato mude consoante a versão, redireciona para a página de releases oficial
                    downloadLink = `https://github.com/${app.target}/releases/latest`;
                    buttonText = "Ver Página de Releases";
                    buttonClass = "bg-slate-800 hover:bg-slate-700 text-blue-400 border border-slate-700";
                } else {
                    downloadLink = app.target;
                    buttonText = "Abrir Página Oficial";
                    buttonClass = "bg-slate-800 hover:bg-slate-700 text-blue-400 border border-slate-700";
                }

                return `
                    <div class="bg-slate-900 rounded-xl p-4 border border-slate-800 shadow space-y-3">
                        <div class="flex justify-between items-center">
                            <div>
                                <h3 class="font-semibold text-slate-100 text-sm">${app.name}</h3>
                                <p class="text-xs text-slate-500 font-mono mt-0.5">${app.pkg}</p>
                            </div>
                            <button onclick="toggleInstallState('${app.pkg}')" class="text-[10px] px-2.5 py-1 rounded-full transition cursor-pointer ${badgeClass}">
                                ${badgeText}
                            </button>
                        </div>
                        <div class="flex items-center justify-between pt-1 border-t border-slate-800/60">
                            <span class="text-xs text-slate-400">Ação rápida:</span>
                            <a href="${downloadLink}" target="_blank" 
                               class="${buttonClass} px-3 py-1.5 rounded-lg text-xs font-medium transition inline-flex items-center gap-1">
                                📥 ${buttonText}
                            </a>
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('statusCount').innerText = "Painel pronto a utilizar!";
        }

        renderList();
    </script>
</body>
</html>
